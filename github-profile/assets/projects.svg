<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%">
  <defs>
    <radialGradient id="projBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#050816"/>
    </radialGradient>

    <filter id="projGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00F5FF" flood-opacity="0.1"/>
    </filter>

    <linearGradient id="projGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="projGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#00F5FF"/>
    </linearGradient>

    <linearGradient id="projGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <clipPath id="cardClip1">
      <rect x="0" y="0" width="360" height="480" rx="20"/>
    </clipPath>

    <!-- Animated border gradient -->
    <linearGradient id="animBorder1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF">
        <animate attributeName="stop-color" values="#00F5FF;#3B82F6;#00F5FF" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#3B82F6">
        <animate attributeName="stop-color" values="#3B82F6;#00F5FF;#3B82F6" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="animBorder2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#00F5FF;#8B5CF6" dur="4s" repeatCount="indefinite" begin="1s"/>
      </stop>
      <stop offset="100%" stop-color="#00F5FF">
        <animate attributeName="stop-color" values="#00F5FF;#8B5CF6;#00F5FF" dur="4s" repeatCount="indefinite" begin="1s"/>
      </stop>
    </linearGradient>

    <linearGradient id="animBorder3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6">
        <animate attributeName="stop-color" values="#3B82F6;#8B5CF6;#3B82F6" dur="4s" repeatCount="indefinite" begin="2s"/>
      </stop>
      <stop offset="100%" stop-color="#8B5CF6">
        <animate attributeName="stop-color" values="#8B5CF6;#3B82F6;#8B5CF6" dur="4s" repeatCount="indefinite" begin="2s"/>
      </stop>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="650" fill="url(#projBg)"/>

  <!-- Section Title -->
  <text x="600" y="50" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="300" fill="#00F5FF" letter-spacing="8" opacity="0.9">FEATURED PROJECTS</text>
  <line x1="500" y1="65" x2="700" y2="65" stroke="#00F5FF" stroke-width="0.5" opacity="0.3"/>

  <!-- ===== PROJECT 1: ATLAS AI ===== -->
  <g transform="translate(60, 100)">
    <!-- Card Glow Border -->
    <rect x="-2" y="-2" width="364" height="484" rx="22" fill="none" stroke="url(#animBorder1)" stroke-width="2" filter="url(#projGlow)"/>

    <!-- Glass Card -->
    <rect x="0" y="0" width="360" height="480" rx="20" fill="rgba(0, 245, 255, 0.03)" stroke="rgba(0, 245, 255, 0.15)" stroke-width="1"/>

    <!-- Project Number -->
    <text x="30" y="45" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#00F5FF" opacity="0.4" letter-spacing="2">01</text>

    <!-- Project Icon -->
    <g transform="translate(180, 110)" filter="url(#projGlow)">
      <circle r="40" fill="none" stroke="url(#projGrad1)" stroke-width="1.5"/>
      <circle r="30" fill="none" stroke="url(#projGrad1)" stroke-width="0.5" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="20s" repeatCount="indefinite"/>
      </circle>
      <!-- Multi-agent nodes -->
      <circle cx="-15" cy="-10" r="4" fill="#00F5FF" opacity="0.8"/>
      <circle cx="15" cy="-10" r="4" fill="#3B82F6" opacity="0.8"/>
      <circle cx="0" cy="15" r="4" fill="#00F5FF" opacity="0.8"/>
      <line x1="-15" y1="-10" x2="15" y2="-10" stroke="#00F5FF" stroke-width="0.5" opacity="0.5"/>
      <line x1="-15" y1="-10" x2="0" y2="15" stroke="#3B82F6" stroke-width="0.5" opacity="0.5"/>
      <line x1="15" y1="-10" x2="0" y2="15" stroke="#00F5FF" stroke-width="0.5" opacity="0.5"/>
    </g>

    <!-- Project Title -->
    <text x="180" y="190" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#00F5FF" filter="url(#projGlow)" letter-spacing="2">ATLAS AI</text>

    <!-- Description -->
    <text x="180" y="220" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#00F5FF" opacity="0.6">Offline Multi-Agent AI Assistant</text>

    <!-- Divider -->
    <line x1="60" y1="245" x2="300" y2="245" stroke="#00F5FF" stroke-width="0.5" opacity="0.2"/>

    <!-- Tech Stack -->
    <text x="30" y="275" font-family="'Segoe UI', sans-serif" font-size="11" fill="#00F5FF" opacity="0.5" letter-spacing="2">TECHNOLOGIES</text>

    <g transform="translate(30, 295)">
      <rect x="0" y="0" width="70" height="26" rx="6" fill="rgba(0, 245, 255, 0.08)" stroke="rgba(0, 245, 255, 0.2)" stroke-width="0.5"/>
      <text x="35" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#00F5FF" opacity="0.8">Python</text>

      <rect x="80" y="0" width="70" height="26" rx="6" fill="rgba(0, 245, 255, 0.08)" stroke="rgba(0, 245, 255, 0.2)" stroke-width="0.5"/>
      <text x="115" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#00F5FF" opacity="0.8">FastAPI</text>

      <rect x="160" y="0" width="90" height="26" rx="6" fill="rgba(0, 245, 255, 0.08)" stroke="rgba(0, 245, 255, 0.2)" stroke-width="0.5"/>
      <text x="205" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#00F5FF" opacity="0.8">LangGraph</text>

      <rect x="0" y="36" width="50" height="26" rx="6" fill="rgba(0, 245, 255, 0.08)" stroke="rgba(0, 245, 255, 0.2)" stroke-width="0.5"/>
      <text x="25" y="53" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#00F5FF" opacity="0.8">RAG</text>

      <rect x="60" y="36" width="70" height="26" rx="6" fill="rgba(0, 245, 255, 0.08)" stroke="rgba(0, 245, 255, 0.2)" stroke-width="0.5"/>
      <text x="95" y="53" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#00F5FF" opacity="0.8">Ollama</text>

      <rect x="140" y="36" width="90" height="26" rx="6" fill="rgba(0, 245, 255, 0.08)" stroke="rgba(0, 245, 255, 0.2)" stroke-width="0.5"/>
      <text x="185" y="53" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#00F5FF" opacity="0.8">ChromaDB</text>
    </g>

    <!-- Repository Link -->
    <g transform="translate(30, 420)">
      <rect x="0" y="0" width="300" height="36" rx="8" fill="rgba(0, 245, 255, 0.05)" stroke="rgba(0, 245, 255, 0.2)" stroke-width="1"/>
      <text x="150" y="23" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11" fill="#00F5FF" opacity="0.7">github.com/Pramod707/atlas-ai</text>
    </g>

    <!-- Corner Accents -->
    <path d="M 0 30 L 0 0 L 30 0" fill="none" stroke="#00F5FF" stroke-width="1.5" opacity="0.5"/>
    <path d="M 330 0 L 360 0 L 360 30" fill="none" stroke="#00F5FF" stroke-width="1.5" opacity="0.5"/>
    <path d="M 0 450 L 0 480 L 30 480" fill="none" stroke="#00F5FF" stroke-width="1.5" opacity="0.5"/>
    <path d="M 330 480 L 360 480 L 360 450" fill="none" stroke="#00F5FF" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- ===== PROJECT 2: PHISH-SHIELD ===== -->
  <g transform="translate(420, 100)">
    <rect x="-2" y="-2" width="364" height="484" rx="22" fill="none" stroke="url(#animBorder2)" stroke-width="2" filter="url(#projGlow)"/>
    <rect x="0" y="0" width="360" height="480" rx="20" fill="rgba(139, 92, 246, 0.03)" stroke="rgba(139, 92, 246, 0.15)" stroke-width="1"/>

    <text x="30" y="45" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#8B5CF6" opacity="0.4" letter-spacing="2">02</text>

    <!-- Shield Icon -->
    <g transform="translate(180, 110)" filter="url(#projGlow)">
      <path d="M 0 -35 L 30 -20 L 30 10 L 0 35 L -30 10 L -30 -20 Z" fill="none" stroke="url(#projGrad2)" stroke-width="1.5"/>
      <path d="M 0 -25 L 20 -12 L 20 8 L 0 25 L -20 8 L -20 -12 Z" fill="none" stroke="url(#projGrad2)" stroke-width="0.5" opacity="0.5"/>
      <path d="M -8 0 L -3 5 L 8 -6" fill="none" stroke="#00F5FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="180" y="190" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" font-weight="700" fill="#8B5CF6" filter="url(#projGlow)" letter-spacing="2">PHISH-SHIELD</text>
    <text x="180" y="220" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#8B5CF6" opacity="0.6">AI Powered URL Detection</text>

    <line x1="60" y1="245" x2="300" y2="245" stroke="#8B5CF6" stroke-width="0.5" opacity="0.2"/>

    <text x="30" y="275" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8B5CF6" opacity="0.5" letter-spacing="2">TECHNOLOGIES</text>

    <g transform="translate(30, 295)">
      <rect x="0" y="0" width="70" height="26" rx="6" fill="rgba(139, 92, 246, 0.08)" stroke="rgba(139, 92, 246, 0.2)" stroke-width="0.5"/>
      <text x="35" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8B5CF6" opacity="0.8">Python</text>

      <rect x="80" y="0" width="60" height="26" rx="6" fill="rgba(139, 92, 246, 0.08)" stroke="rgba(139, 92, 246, 0.2)" stroke-width="0.5"/>
      <text x="110" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8B5CF6" opacity="0.8">Flask</text>

      <rect x="150" y="0" width="120" height="26" rx="6" fill="rgba(139, 92, 246, 0.08)" stroke="rgba(139, 92, 246, 0.2)" stroke-width="0.5"/>
      <text x="210" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8B5CF6" opacity="0.8">Machine Learning</text>

      <rect x="0" y="36" width="100" height="26" rx="6" fill="rgba(139, 92, 246, 0.08)" stroke="rgba(139, 92, 246, 0.2)" stroke-width="0.5"/>
      <text x="50" y="53" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8B5CF6" opacity="0.8">Scikit-Learn</text>
    </g>

    <g transform="translate(30, 420)">
      <rect x="0" y="0" width="300" height="36" rx="8" fill="rgba(139, 92, 246, 0.05)" stroke="rgba(139, 92, 246, 0.2)" stroke-width="1"/>
      <text x="150" y="23" text-anchor="middle" font-family="'SF Mono', monospace" font-size="11" fill="#8B5CF6" opacity="0.7">github.com/Pramod707/Phish-Shield</text>
    </g>

    <path d="M 0 30 L 0 0 L 30 0" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.5"/>
    <path d="M 330 0 L 360 0 L 360 30" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.5"/>
    <path d="M 0 450 L 0 480 L 30 480" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.5"/>
    <path d="M 330 480 L 360 480 L 360 450" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- ===== PROJECT 3: RETAIL ANALYTICS ===== -->
  <g transform="translate(780, 100)">
    <rect x="-2" y="-2" width="364" height="484" rx="22" fill="none" stroke="url(#animBorder3)" stroke-width="2" filter="url(#projGlow)"/>
    <rect x="0" y="0" width="360" height="480" rx="20" fill="rgba(59, 130, 246, 0.03)" stroke="rgba(59, 130, 246, 0.15)" stroke-width="1"/>

    <text x="30" y="45" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#3B82F6" opacity="0.4" letter-spacing="2">03</text>

    <!-- Analytics Icon -->
    <g transform="translate(180, 110)" filter="url(#projGlow)">
      <rect x="-35" y="-25" width="70" height="50" rx="4" fill="none" stroke="url(#projGrad3)" stroke-width="1.5"/>
      <line x1="-25" y1="5" x2="-10" y2="-5" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="-10" y1="-5" x2="5" y2="5" stroke="#8B5CF6" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="5" y1="5" x2="20" y2="-10" stroke="#3B82F6" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="-25" cy="5" r="2" fill="#3B82F6"/>
      <circle cx="-10" cy="-5" r="2" fill="#8B5CF6"/>
      <circle cx="5" cy="5" r="2" fill="#3B82F6"/>
      <circle cx="20" cy="-10" r="2" fill="#8B5CF6"/>
    </g>

    <text x="180" y="190" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#3B82F6" filter="url(#projGlow)" letter-spacing="1">RETAIL CONSUMER</text>
    <text x="180" y="215" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="700" fill="#3B82F6" filter="url(#projGlow)" letter-spacing="1">BEHAVIOR ANALYTICS</text>
    <text x="180" y="245" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#3B82F6" opacity="0.6">Consumer Insights Dashboard</text>

    <line x1="60" y1="270" x2="300" y2="270" stroke="#3B82F6" stroke-width="0.5" opacity="0.2"/>

    <text x="30" y="300" font-family="'Segoe UI', sans-serif" font-size="11" fill="#3B82F6" opacity="0.5" letter-spacing="2">TECHNOLOGIES</text>

    <g transform="translate(30, 320)">
      <rect x="0" y="0" width="70" height="26" rx="6" fill="rgba(59, 130, 246, 0.08)" stroke="rgba(59, 130, 246, 0.2)" stroke-width="0.5"/>
      <text x="35" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#3B82F6" opacity="0.8">Power BI</text>

      <rect x="80" y="0" width="50" height="26" rx="6" fill="rgba(59, 130, 246, 0.08)" stroke="rgba(59, 130, 246, 0.2)" stroke-width="0.5"/>
      <text x="105" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#3B82F6" opacity="0.8">SQL</text>

      <rect x="140" y="0" width="70" height="26" rx="6" fill="rgba(59, 130, 246, 0.08)" stroke="rgba(59, 130, 246, 0.2)" stroke-width="0.5"/>
      <text x="175" y="17" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#3B82F6" opacity="0.8">Python</text>

      <rect x="0" y="36" width="70" height="26" rx="6" fill="rgba(59, 130, 246, 0.08)" stroke="rgba(59, 130, 246, 0.2)" stroke-width="0.5"/>
      <text x="35" y="53" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="11" fill="#3B82F6" opacity="0.8">Pandas</text>
    </g>

    <g transform="translate(30, 420)">
      <rect x="0" y="0" width="300" height="36" rx="8" fill="rgba(59, 130, 246, 0.05)" stroke="rgba(59, 130, 246, 0.2)" stroke-width="1"/>
      <text x="150" y="23" text-anchor="middle" font-family="'SF Mono', monospace" font-size="10" fill="#3B82F6" opacity="0.7">github.com/Pramod707/Retail-Consumer...</text>
    </g>

    <path d="M 0 30 L 0 0 L 30 0" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.5"/>
    <path d="M 330 0 L 360 0 L 360 30" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.5"/>
    <path d="M 0 450 L 0 480 L 30 480" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.5"/>
    <path d="M 330 480 L 360 480 L 360 450" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Connection Lines -->
  <line x1="420" y1="340" x2="420" y2="340" stroke="#00F5FF" stroke-width="0.5" opacity="0.1"/>
</svg>