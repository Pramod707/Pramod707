<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 60" width="100%">
  <defs>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050816" stop-opacity="0"/>
      <stop offset="20%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="80%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0"/>
    </linearGradient>

    <filter id="divGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="60" fill="#050816"/>

  <!-- Main Line -->
  <line x1="100" y1="30" x2="1100" y2="30" stroke="url(#divGrad)" stroke-width="1.5" filter="url(#divGlow)"/>

  <!-- Center Diamond -->
  <g transform="translate(600, 30)">
    <polygon points="0,-8 8,0 0,8 -8,0" fill="none" stroke="#00F5FF" stroke-width="1.5" filter="url(#divGlow)">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="8s" repeatCount="indefinite"/>
    </polygon>
    <circle r="3" fill="#00F5FF" filter="url(#divGlow)">
      <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Left Decorative Elements -->
  <g transform="translate(300, 30)">
    <circle r="2" fill="#8B5CF6" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(200, 30)">
    <circle r="1.5" fill="#3B82F6" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.5s" repeatCount="indefinite" begin="0.5s"/>
    </circle>
  </g>

  <!-- Right Decorative Elements -->
  <g transform="translate(900, 30)">
    <circle r="2" fill="#8B5CF6" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.2;0.6" dur="3s" repeatCount="indefinite" begin="1s"/>
    </circle>
  </g>
  <g transform="translate(1000, 30)">
    <circle r="1.5" fill="#3B82F6" opacity="0.4">
      <animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.5s" repeatCount="indefinite" begin="1.5s"/>
    </circle>
  </g>

  <!-- Animated Pulse Lines -->
  <line x1="100" y1="30" x2="300" y2="30" stroke="#00F5FF" stroke-width="0.5" opacity="0.3" stroke-dasharray="5,10">
    <animate attributeName="stroke-dashoffset" values="0;-15" dur="1s" repeatCount="indefinite"/>
  </line>
  <line x1="900" y1="30" x2="1100" y2="30" stroke="#00F5FF" stroke-width="0.5" opacity="0.3" stroke-dasharray="5,10">
    <animate attributeName="stroke-dashoffset" values="0;-15" dur="1s" repeatCount="indefinite"/>
  </line>
</svg>