<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%">
  <defs>
    <radialGradient id="footBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#050816"/>
    </radialGradient>

    <filter id="footGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="footGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#footBg)"/>

  <!-- Top Border -->
  <line x1="100" y1="20" x2="1100" y2="20" stroke="url(#footGrad)" stroke-width="1" opacity="0.3" filter="url(#footGlow)"/>

  <!-- Center Content -->
  <g transform="translate(600, 100)">
    <!-- Logo/Icon -->
    <g filter="url(#footGlow)">
      <circle r="25" fill="none" stroke="#00F5FF" stroke-width="1" opacity="0.5">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="15s" repeatCount="indefinite"/>
      </circle>
      <circle r="18" fill="none" stroke="#8B5CF6" stroke-width="0.5" opacity="0.4">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="10s" repeatCount="indefinite"/>
      </circle>
      <text x="0" y="6" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#00F5FF" letter-spacing="2">P</text>
    </g>

    <!-- Name -->
    <text x="0" y="60" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#00F5FF" filter="url(#footGlow)" letter-spacing="4">B. PRAMOD</text>

    <!-- Role -->
    <text x="0" y="85" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="13" fill="#8B5CF6" opacity="0.8" letter-spacing="3">AI ENGINEER</text>
  </g>

  <!-- Contact Links -->
  <g transform="translate(600, 180)">
    <!-- GitHub -->
    <g transform="translate(-150, 0)">
      <rect x="-50" y="-18" width="100" height="36" rx="8" fill="rgba(0, 245, 255, 0.05)" stroke="rgba(0, 245, 255, 0.2)" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="'SF Mono', monospace" font-size="12" fill="#00F5FF" opacity="0.8">GitHub</text>
    </g>

    <!-- LinkedIn -->
    <g transform="translate(0, 0)">
      <rect x="-50" y="-18" width="100" height="36" rx="8" fill="rgba(139, 92, 246, 0.05)" stroke="rgba(139, 92, 246, 0.2)" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="'SF Mono', monospace" font-size="12" fill="#8B5CF6" opacity="0.8">LinkedIn</text>
    </g>

    <!-- Email -->
    <g transform="translate(150, 0)">
      <rect x="-50" y="-18" width="100" height="36" rx="8" fill="rgba(59, 130, 246, 0.05)" stroke="rgba(59, 130, 246, 0.2)" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" font-family="'SF Mono', monospace" font-size="12" fill="#3B82F6" opacity="0.8">Email</text>
    </g>
  </g>

  <!-- Bottom Line -->
  <line x1="100" y1="260" x2="1100" y2="260" stroke="url(#footGrad)" stroke-width="0.5" opacity="0.2"/>

  <!-- Copyright -->
  <text x="600" y="285" text-anchor="middle" font-family="'SF Mono', monospace" font-size="10" fill="#00F5FF" opacity="0.4" letter-spacing="2">NEURAL OS v2.0 // BUILT WITH AI</text>

  <!-- Animated Particles -->
  <circle cx="200" cy="240" r="2" fill="#00F5FF" opacity="0.3">
    <animate attributeName="cy" values="240;220;240" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1000" cy="240" r="2" fill="#8B5CF6" opacity="0.3">
    <animate attributeName="cy" values="240;220;240" dur="5s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="opacity" values="0.3;0;0.3" dur="5s" repeatCount="indefinite" begin="1s"/>
  </circle>
</svg>