<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%">
  <defs>
    <radialGradient id="bgMain" cx="50%" cy="50%" r="80%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="50%" stop-color="#050816"/>
      <stop offset="100%" stop-color="#02040a"/>
    </radialGradient>

    <pattern id="bgGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#00F5FF" stroke-width="0.2" opacity="0.08"/>
    </pattern>

    <filter id="bgGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="800" fill="url(#bgMain)"/>

  <!-- Subtle Grid -->
  <rect width="1200" height="800" fill="url(#bgGrid)"/>

  <!-- Ambient Glow Spots -->
  <circle cx="200" cy="200" r="150" fill="#00F5FF" opacity="0.02" filter="url(#bgGlow)"/>
  <circle cx="1000" cy="600" r="200" fill="#8B5CF6" opacity="0.02" filter="url(#bgGlow)"/>
  <circle cx="600" cy="400" r="100" fill="#3B82F6" opacity="0.015" filter="url(#bgGlow)"/>

  <!-- Floating Particles -->
  <g opacity="0.2">
    <circle cx="100" cy="100" r="1.5" fill="#00F5FF">
      <animate attributeName="cy" values="100;700;100" dur="20s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.2;0;0.2" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="600" r="2" fill="#8B5CF6">
      <animate attributeName="cy" values="600;100;600" dur="25s" repeatCount="indefinite" begin="2s"/>
      <animate attributeName="opacity" values="0.2;0;0.2" dur="25s" repeatCount="indefinite" begin="2s"/>
    </circle>
    <circle cx="500" cy="200" r="1" fill="#3B82F6">
      <animate attributeName="cy" values="200;600;200" dur="18s" repeatCount="indefinite" begin="4s"/>
      <animate attributeName="opacity" values="0.2;0;0.2" dur="18s" repeatCount="indefinite" begin="4s"/>
    </circle>
    <circle cx="700" cy="500" r="1.5" fill="#00F5FF">
      <animate attributeName="cy" values="500;150;500" dur="22s" repeatCount="indefinite" begin="1s"/>
      <animate attributeName="opacity" values="0.2;0;0.2" dur="22s" repeatCount="indefinite" begin="1s"/>
    </circle>
    <circle cx="900" cy="300" r="2" fill="#8B5CF6">
      <animate attributeName="cy" values="300;700;300" dur="24s" repeatCount="indefinite" begin="3s"/>
      <animate attributeName="opacity" values="0.2;0;0.2" dur="24s" repeatCount="indefinite" begin="3s"/>
    </circle>
    <circle cx="1100" cy="400" r="1" fill="#3B82F6">
      <animate attributeName="cy" values="400;100;400" dur="19s" repeatCount="indefinite" begin="5s"/>
      <animate attributeName="opacity" values="0.2;0;0.2" dur="19s" repeatCount="indefinite" begin="5s"/>
    </circle>
  </g>

  <!-- Circuit Lines Background -->
  <g opacity="0.05">
    <path d="M 0 100 L 200 100 L 200 300 L 400 300" fill="none" stroke="#00F5FF" stroke-width="1"/>
    <path d="M 1200 200 L 1000 200 L 1000 400 L 800 400" fill="none" stroke="#8B5CF6" stroke-width="1"/>
    <path d="M 0 600 L 150 600 L 150 700 L 350 700" fill="none" stroke="#3B82F6" stroke-width="1"/>
    <path d="M 1200 500 L 1050 500 L 1050 650 L 850 650" fill="none" stroke="#00F5FF" stroke-width="1"/>

    <!-- Circuit Nodes -->
    <circle cx="200" cy="100" r="3" fill="#00F5FF"/>
    <circle cx="200" cy="300" r="3" fill="#00F5FF"/>
    <circle cx="400" cy="300" r="3" fill="#00F5FF"/>
    <circle cx="1000" cy="200" r="3" fill="#8B5CF6"/>
    <circle cx="1000" cy="400" r="3" fill="#8B5CF6"/>
    <circle cx="800" cy="400" r="3" fill="#8B5CF6"/>
  </g>
</svg>