<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%">
  <defs>
    <radialGradient id="skillBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#050816"/>
    </radialGradient>

    <filter id="skillGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <linearGradient id="backendGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#00F5FF"/>
    </linearGradient>

    <linearGradient id="analyticsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="progGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>

    <linearGradient id="devopsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Holographic shine effect -->
    <linearGradient id="holoShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0"/>
      <stop offset="50%" stop-color="white" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="600" fill="url(#skillBg)"/>

  <!-- Section Title -->
  <text x="600" y="50" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="300" fill="#00F5FF" letter-spacing="8" opacity="0.9">SKILL MATRIX</text>
  <line x1="520" y1="65" x2="680" y2="65" stroke="#00F5FF" stroke-width="0.5" opacity="0.3"/>

  <!-- ===== CARD 1: AI ===== -->
  <g transform="translate(60, 100)">
    <!-- Card Background -->
    <rect x="0" y="0" width="200" height="220" rx="16" fill="rgba(0, 245, 255, 0.04)" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1"/>
    <rect x="0" y="0" width="200" height="220" rx="16" fill="url(#holoShine)"/>

    <!-- Top Accent Line -->
    <rect x="20" y="0" width="160" height="2" fill="url(#aiGrad)" filter="url(#skillGlow)"/>

    <!-- Icon: Brain/AI -->
    <g transform="translate(100, 55)" filter="url(#skillGlow)">
      <path d="M -20 -10 C -20 -25, 20 -25, 20 -10 C 20 5, 10 15, 0 20 C -10 15, -20 5, -20 -10 Z" fill="none" stroke="#00F5FF" stroke-width="1.5"/>
      <circle cx="-8" cy="-5" r="2" fill="#00F5FF"/>
      <circle cx="8" cy="-5" r="2" fill="#00F5FF"/>
      <circle cx="0" cy="5" r="2" fill="#00F5FF"/>
      <line x1="-8" y1="-5" x2="0" y2="5" stroke="#00F5FF" stroke-width="0.5"/>
      <line x1="8" y1="-5" x2="0" y2="5" stroke="#00F5FF" stroke-width="0.5"/>
      <line x1="-8" y1="-5" x2="8" y2="-5" stroke="#00F5FF" stroke-width="0.5"/>
    </g>

    <!-- Category Title -->
    <text x="100" y="100" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#00F5FF" letter-spacing="3">AI</text>

    <!-- Skills -->
    <text x="100" y="130" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#00F5FF" opacity="0.7">LangChain</text>
    <text x="100" y="150" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#00F5FF" opacity="0.7">LangGraph</text>
    <text x="100" y="170" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#00F5FF" opacity="0.7">RAG Systems</text>
    <text x="100" y="190" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#00F5FF" opacity="0.7">Ollama</text>

    <!-- Corner Accents -->
    <path d="M 0 20 L 0 0 L 20 0" fill="none" stroke="#00F5FF" stroke-width="1.5" opacity="0.6"/>
    <path d="M 180 0 L 200 0 L 200 20" fill="none" stroke="#00F5FF" stroke-width="1.5" opacity="0.6"/>
    <path d="M 0 200 L 0 220 L 20 220" fill="none" stroke="#00F5FF" stroke-width="1.5" opacity="0.6"/>
    <path d="M 180 220 L 200 220 L 200 200" fill="none" stroke="#00F5FF" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- ===== CARD 2: BACKEND ===== -->
  <g transform="translate(290, 100)">
    <rect x="0" y="0" width="200" height="220" rx="16" fill="rgba(139, 92, 246, 0.04)" stroke="rgba(139, 92, 246, 0.25)" stroke-width="1"/>
    <rect x="0" y="0" width="200" height="220" rx="16" fill="url(#holoShine)"/>
    <rect x="20" y="0" width="160" height="2" fill="url(#backendGrad)" filter="url(#skillGlow)"/>

    <!-- Icon: Server -->
    <g transform="translate(100, 55)" filter="url(#skillGlow)">
      <rect x="-15" y="-15" width="30" height="30" rx="3" fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
      <line x1="-10" y1="-5" x2="10" y2="-5" stroke="#8B5CF6" stroke-width="1"/>
      <line x1="-10" y1="0" x2="10" y2="0" stroke="#8B5CF6" stroke-width="1"/>
      <line x1="-10" y1="5" x2="10" y2="5" stroke="#8B5CF6" stroke-width="1"/>
      <circle cx="-5" cy="-10" r="1.5" fill="#8B5CF6"/>
    </g>

    <text x="100" y="100" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#8B5CF6" letter-spacing="3">BACKEND</text>

    <text x="100" y="130" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8B5CF6" opacity="0.7">FastAPI</text>
    <text x="100" y="150" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8B5CF6" opacity="0.7">Flask</text>
    <text x="100" y="170" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8B5CF6" opacity="0.7">PostgreSQL</text>
    <text x="100" y="190" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8B5CF6" opacity="0.7">REST APIs</text>

    <path d="M 0 20 L 0 0 L 20 0" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.6"/>
    <path d="M 180 0 L 200 0 L 200 20" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.6"/>
    <path d="M 0 200 L 0 220 L 20 220" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.6"/>
    <path d="M 180 220 L 200 220 L 200 200" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- ===== CARD 3: ANALYTICS ===== -->
  <g transform="translate(520, 100)">
    <rect x="0" y="0" width="200" height="220" rx="16" fill="rgba(59, 130, 246, 0.04)" stroke="rgba(59, 130, 246, 0.25)" stroke-width="1"/>
    <rect x="0" y="0" width="200" height="220" rx="16" fill="url(#holoShine)"/>
    <rect x="20" y="0" width="160" height="2" fill="url(#analyticsGrad)" filter="url(#skillGlow)"/>

    <!-- Icon: Chart -->
    <g transform="translate(100, 55)" filter="url(#skillGlow)">
      <rect x="-15" y="-10" width="8" height="20" rx="1" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
      <rect x="-3" y="-5" width="8" height="15" rx="1" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
      <rect x="9" y="-15" width="8" height="25" rx="1" fill="none" stroke="#3B82F6" stroke-width="1.5"/>
    </g>

    <text x="100" y="100" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#3B82F6" letter-spacing="3">ANALYTICS</text>

    <text x="100" y="130" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#3B82F6" opacity="0.7">Power BI</text>
    <text x="100" y="150" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#3B82F6" opacity="0.7">Pandas</text>
    <text x="100" y="170" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#3B82F6" opacity="0.7">SQL</text>
    <text x="100" y="190" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#3B82F6" opacity="0.7">Data Visualization</text>

    <path d="M 0 20 L 0 0 L 20 0" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
    <path d="M 180 0 L 200 0 L 200 20" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
    <path d="M 0 200 L 0 220 L 20 220" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
    <path d="M 180 220 L 200 220 L 200 200" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- ===== CARD 4: PROGRAMMING ===== -->
  <g transform="translate(750, 100)">
    <rect x="0" y="0" width="200" height="220" rx="16" fill="rgba(0, 245, 255, 0.04)" stroke="rgba(0, 245, 255, 0.25)" stroke-width="1"/>
    <rect x="0" y="0" width="200" height="220" rx="16" fill="url(#holoShine)"/>
    <rect x="20" y="0" width="160" height="2" fill="url(#progGrad)" filter="url(#skillGlow)"/>

    <!-- Icon: Code -->
    <g transform="translate(100, 55)" filter="url(#skillGlow)">
      <polyline points="-12,-8 -20,0 -12,8" fill="none" stroke="#00F5FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <polyline points="12,-8 20,0 12,8" fill="none" stroke="#00F5FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <line x1="-6" y1="12" x2="6" y2="-12" stroke="#00F5FF" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <text x="100" y="100" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#00F5FF" letter-spacing="3">PROGRAMMING</text>

    <text x="100" y="130" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#00F5FF" opacity="0.7">Python</text>
    <text x="100" y="150" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#00F5FF" opacity="0.7">JavaScript</text>
    <text x="100" y="170" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#00F5FF" opacity="0.7">TypeScript</text>
    <text x="100" y="190" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#00F5FF" opacity="0.7">C++</text>

    <path d="M 0 20 L 0 0 L 20 0" fill="none" stroke="#00F5FF" stroke-width="1.5" opacity="0.6"/>
    <path d="M 180 0 L 200 0 L 200 20" fill="none" stroke="#00F5FF" stroke-width="1.5" opacity="0.6"/>
    <path d="M 0 200 L 0 220 L 20 220" fill="none" stroke="#00F5FF" stroke-width="1.5" opacity="0.6"/>
    <path d="M 180 220 L 200 220 L 200 200" fill="none" stroke="#00F5FF" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- ===== CARD 5: DEVOPS ===== -->
  <g transform="translate(980, 100)">
    <rect x="0" y="0" width="200" height="220" rx="16" fill="rgba(139, 92, 246, 0.04)" stroke="rgba(139, 92, 246, 0.25)" stroke-width="1"/>
    <rect x="0" y="0" width="200" height="220" rx="16" fill="url(#holoShine)"/>
    <rect x="20" y="0" width="160" height="2" fill="url(#devopsGrad)" filter="url(#skillGlow)"/>

    <!-- Icon: Container -->
    <g transform="translate(100, 55)" filter="url(#skillGlow)">
      <rect x="-12" y="-12" width="24" height="24" rx="3" fill="none" stroke="#8B5CF6" stroke-width="1.5"/>
      <rect x="-8" y="-8" width="8" height="8" rx="1" fill="none" stroke="#8B5CF6" stroke-width="1"/>
      <rect x="2" y="-8" width="8" height="8" rx="1" fill="none" stroke="#8B5CF6" stroke-width="1"/>
      <rect x="-8" y="2" width="8" height="8" rx="1" fill="none" stroke="#8B5CF6" stroke-width="1"/>
      <rect x="2" y="2" width="8" height="8" rx="1" fill="none" stroke="#8B5CF6" stroke-width="1"/>
    </g>

    <text x="100" y="100" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="600" fill="#8B5CF6" letter-spacing="3">DEVOPS</text>

    <text x="100" y="130" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8B5CF6" opacity="0.7">Docker</text>
    <text x="100" y="150" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8B5CF6" opacity="0.7">Git</text>
    <text x="100" y="170" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8B5CF6" opacity="0.7">GitHub Actions</text>
    <text x="100" y="190" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="12" fill="#8B5CF6" opacity="0.7">Linux</text>

    <path d="M 0 20 L 0 0 L 20 0" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.6"/>
    <path d="M 180 0 L 200 0 L 200 20" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.6"/>
    <path d="M 0 200 L 0 220 L 20 220" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.6"/>
    <path d="M 180 220 L 200 220 L 200 200" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- ===== BOTTOM ROW: SKILL ICONS (Using SkillIcons style) ===== -->
  <g transform="translate(0, 360)">
    <text x="600" y="0" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="300" fill="#00F5FF" opacity="0.6" letter-spacing="4">TECH STACK</text>
    <line x1="500" y1="15" x2="700" y2="15" stroke="#00F5FF" stroke-width="0.5" opacity="0.2"/>

    <!-- Tech Icons Row 1 -->
    <g transform="translate(100, 50)">
      <!-- Python -->
      <rect x="0" y="0" width="70" height="70" rx="10" fill="rgba(0, 245, 255, 0.08)" stroke="rgba(0, 245, 255, 0.3)" stroke-width="1"/>
      <text x="35" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="22" fill="#00F5FF" filter="url(#skillGlow)">Py</text>
      <text x="35" y="55" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#00F5FF" opacity="0.7">Python</text>

      <!-- FastAPI -->
      <rect x="90" y="0" width="70" height="70" rx="10" fill="rgba(139, 92, 246, 0.08)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1"/>
      <text x="125" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" fill="#8B5CF6" filter="url(#skillGlow)">⚡</text>
      <text x="125" y="55" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#8B5CF6" opacity="0.7">FastAPI</text>

      <!-- LangChain -->
      <rect x="180" y="0" width="70" height="70" rx="10" fill="rgba(59, 130, 246, 0.08)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1"/>
      <text x="215" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" fill="#3B82F6" filter="url(#skillGlow)">⛓</text>
      <text x="215" y="55" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#3B82F6" opacity="0.7">LangChain</text>

      <!-- PostgreSQL -->
      <rect x="270" y="0" width="70" height="70" rx="10" fill="rgba(0, 245, 255, 0.08)" stroke="rgba(0, 245, 255, 0.3)" stroke-width="1"/>
      <text x="305" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" fill="#00F5FF" filter="url(#skillGlow)">🐘</text>
      <text x="305" y="55" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#00F5FF" opacity="0.7">PostgreSQL</text>

      <!-- Docker -->
      <rect x="360" y="0" width="70" height="70" rx="10" fill="rgba(139, 92, 246, 0.08)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1"/>
      <text x="395" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" fill="#8B5CF6" filter="url(#skillGlow)">🐳</text>
      <text x="395" y="55" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#8B5CF6" opacity="0.7">Docker</text>

      <!-- Git -->
      <rect x="450" y="0" width="70" height="70" rx="10" fill="rgba(59, 130, 246, 0.08)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1"/>
      <text x="485" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" fill="#3B82F6" filter="url(#skillGlow)">📦</text>
      <text x="485" y="55" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#3B82F6" opacity="0.7">Git</text>

      <!-- Pandas -->
      <rect x="540" y="0" width="70" height="70" rx="10" fill="rgba(0, 245, 255, 0.08)" stroke="rgba(0, 245, 255, 0.3)" stroke-width="1"/>
      <text x="575" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" fill="#00F5FF" filter="url(#skillGlow)">🐼</text>
      <text x="575" y="55" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#00F5FF" opacity="0.7">Pandas</text>

      <!-- Power BI -->
      <rect x="630" y="0" width="70" height="70" rx="10" fill="rgba(139, 92, 246, 0.08)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1"/>
      <text x="665" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" fill="#8B5CF6" filter="url(#skillGlow)">📊</text>
      <text x="665" y="55" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#8B5CF6" opacity="0.7">Power BI</text>

      <!-- ChromaDB -->
      <rect x="720" y="0" width="70" height="70" rx="10" fill="rgba(59, 130, 246, 0.08)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1"/>
      <text x="755" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" fill="#3B82F6" filter="url(#skillGlow)">🧬</text>
      <text x="755" y="55" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#3B82F6" opacity="0.7">ChromaDB</text>

      <!-- Ollama -->
      <rect x="810" y="0" width="70" height="70" rx="10" fill="rgba(0, 245, 255, 0.08)" stroke="rgba(0, 245, 255, 0.3)" stroke-width="1"/>
      <text x="845" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" fill="#00F5FF" filter="url(#skillGlow)">🦙</text>
      <text x="845" y="55" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#00F5FF" opacity="0.7">Ollama</text>

      <!-- Scikit-Learn -->
      <rect x="900" y="0" width="70" height="70" rx="10" fill="rgba(139, 92, 246, 0.08)" stroke="rgba(139, 92, 246, 0.3)" stroke-width="1"/>
      <text x="935" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" fill="#8B5CF6" filter="url(#skillGlow)">🤖</text>
      <text x="935" y="55" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#8B5CF6" opacity="0.7">Scikit</text>

      <!-- SQL -->
      <rect x="990" y="0" width="70" height="70" rx="10" fill="rgba(59, 130, 246, 0.08)" stroke="rgba(59, 130, 246, 0.3)" stroke-width="1"/>
      <text x="1025" y="30" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="18" fill="#3B82F6" filter="url(#skillGlow)">🗄</text>
      <text x="1025" y="55" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="10" fill="#3B82F6" opacity="0.7">SQL</text>
    </g>
  </g>

  <!-- Animated Connection Lines between cards -->
  <line x1="260" y1="210" x2="290" y2="210" stroke="#00F5FF" stroke-width="0.5" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="490" y1="210" x2="520" y2="210" stroke="#8B5CF6" stroke-width="0.5" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite" begin="0.5s"/>
  </line>
  <line x1="720" y1="210" x2="750" y2="210" stroke="#3B82F6" stroke-width="0.5" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite" begin="1s"/>
  </line>
  <line x1="950" y1="210" x2="980" y2="210" stroke="#00F5FF" stroke-width="0.5" opacity="0.2">
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3s" repeatCount="indefinite" begin="1.5s"/>
  </line>
</svg>