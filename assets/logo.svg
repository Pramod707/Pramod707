<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%">
  <defs>
    <radialGradient id="logoBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#050816"/>
    </radialGradient>

    <filter id="logoGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" rx="30" fill="url(#logoBg)" stroke="url(#logoGrad)" stroke-width="2" filter="url(#logoGlow)"/>

  <!-- Outer Ring -->
  <circle cx="100" cy="100" r="75" fill="none" stroke="url(#logoGrad)" stroke-width="1" opacity="0.5">
    <animateTransform attributeName="transform" type="rotate" from="0 100 100" to="360 100 100" dur="20s" repeatCount="indefinite"/>
  </circle>

  <!-- Inner Ring -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="url(#logoGrad)" stroke-width="0.5" opacity="0.3">
    <animateTransform attributeName="transform" type="rotate" from="360 100 100" to="0 100 100" dur="15s" repeatCount="indefinite"/>
  </circle>

  <!-- Hexagon Frame -->
  <polygon points="100,35 155,65 155,125 100,155 45,125 45,65" fill="none" stroke="url(#logoGrad)" stroke-width="1.5" filter="url(#logoGlow)"/>

  <!-- Inner Hexagon -->
  <polygon points="100,55 135,75 135,115 100,135 65,115 65,75" fill="none" stroke="url(#logoGrad)" stroke-width="0.5" opacity="0.4"/>

  <!-- Letter P -->
  <text x="100" y="115" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="48" font-weight="700" fill="url(#logoGrad)" filter="url(#logoGlow)" letter-spacing="2">P</text>

  <!-- Corner Accents -->
  <path d="M 20 40 L 20 20 L 40 20" fill="none" stroke="#00F5FF" stroke-width="1.5" opacity="0.6"/>
  <path d="M 180 40 L 180 20 L 160 20" fill="none" stroke="#00F5FF" stroke-width="1.5" opacity="0.6"/>
  <path d="M 20 160 L 20 180 L 40 180" fill="none" stroke="#00F5FF" stroke-width="1.5" opacity="0.6"/>
  <path d="M 180 160 L 180 180 L 160 180" fill="none" stroke="#00F5FF" stroke-width="1.5" opacity="0.6"/>

  <!-- Status Dot -->
  <circle cx="170" cy="170" r="4" fill="#27c93f" filter="url(#logoGlow)">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>