<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%">
  <defs>
    <radialGradient id="termBg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0c1020"/>
      <stop offset="100%" stop-color="#050816"/>
    </radialGradient>

    <filter id="termGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="screenGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <linearGradient id="termBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5FF"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#00F5FF"/>
    </linearGradient>

    <clipPath id="screenClip">
      <rect x="40" y="60" width="1120" height="320" rx="8"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#termBg)"/>

  <!-- Terminal Frame -->
  <rect x="20" y="20" width="1160" height="360" rx="12" fill="none" stroke="url(#termBorder)" stroke-width="2" filter="url(#termGlow)"/>
  <rect x="25" y="25" width="1150" height="350" rx="10" fill="rgba(5, 8, 22, 0.95)" stroke="rgba(0, 245, 255, 0.1)" stroke-width="1"/>

  <!-- Terminal Header -->
  <rect x="25" y="25" width="1150" height="35" rx="10" fill="rgba(0, 245, 255, 0.05)"/>
  <line x1="25" y1="60" x2="1175" y2="60" stroke="rgba(0, 245, 255, 0.2)" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="55" cy="42" r="6" fill="#ff5f56" opacity="0.8"/>
  <circle cx="75" cy="42" r="6" fill="#ffbd2e" opacity="0.8"/>
  <circle cx="95" cy="42" r="6" fill="#27c93f" opacity="0.8"/>

  <!-- Terminal Title -->
  <text x="600" y="47" text-anchor="middle" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#00F5FF" opacity="0.7" letter-spacing="2">neural-os — bash — 80x24</text>

  <!-- Screen Content -->
  <g clip-path="url(#screenClip)" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace" font-size="14">

    <!-- Line 1: boot -->
    <text x="60" y="90" fill="#00F5FF" filter="url(#termGlow)">
      <tspan font-weight="bold">&gt;</tspan> boot
      <animate attributeName="opacity" values="0;1" dur="0.1s" fill="freeze" begin="0s"/>
    </text>

    <!-- Line 2: Initializing -->
    <text x="60" y="115" fill="#8B5CF6" opacity="0">
      Initializing Neural OS...
      <animate attributeName="opacity" values="0;1" dur="0.1s" fill="freeze" begin="0.8s"/>
    </text>

    <!-- Line 3: Loading AI Modules -->
    <text x="60" y="140" fill="#3B82F6" opacity="0">
      Loading AI Modules...
      <animate attributeName="opacity" values="0;1" dur="0.1s" fill="freeze" begin="1.6s"/>
    </text>

    <!-- Line 4: Connecting GitHub -->
    <text x="60" y="165" fill="#00F5FF" opacity="0">
      Connecting GitHub...
      <animate attributeName="opacity" values="0;1" dur="0.1s" fill="freeze" begin="2.4s"/>
    </text>

    <!-- Line 5: Loading Projects -->
    <text x="60" y="190" fill="#8B5CF6" opacity="0">
      Loading Projects...
      <animate attributeName="opacity" values="0;1" dur="0.1s" fill="freeze" begin="3.2s"/>
    </text>

    <!-- Line 6: Loading Skills -->
    <text x="60" y="215" fill="#3B82F6" opacity="0">
      Loading Skills...
      <animate attributeName="opacity" values="0;1" dur="0.1s" fill="freeze" begin="4.0s"/>
    </text>

    <!-- Line 7: Status -->
    <text x="60" y="240" fill="#00F5FF" opacity="0" filter="url(#termGlow)">
      <tspan font-weight="bold">Status:</tspan> ONLINE
      <animate attributeName="opacity" values="0;1" dur="0.1s" fill="freeze" begin="4.8s"/>
    </text>

    <!-- Line 8: whoami -->
    <text x="60" y="275" fill="#00F5FF" filter="url(#termGlow)" opacity="0">
      <tspan font-weight="bold">&gt;</tspan> whoami
      <animate attributeName="opacity" values="0;1" dur="0.1s" fill="freeze" begin="5.6s"/>
    </text>

    <!-- Line 9: Name -->
    <text x="60" y="300" fill="#8B5CF6" opacity="0">
      B. Pramod
      <animate attributeName="opacity" values="0;1" dur="0.1s" fill="freeze" begin="6.4s"/>
    </text>

    <!-- Line 10: Role -->
    <text x="60" y="320" fill="#3B82F6" opacity="0">
      AI Engineer | Backend Developer
      <animate attributeName="opacity" values="0;1" dur="0.1s" fill="freeze" begin="6.8s"/>
    </text>

    <!-- Line 11: Stack -->
    <text x="60" y="340" fill="#00F5FF" opacity="0">
      Python · FastAPI · LangGraph · Docker · PostgreSQL
      <animate attributeName="opacity" values="0;1" dur="0.1s" fill="freeze" begin="7.2s"/>
    </text>

    <!-- Line 12: Focus -->
    <text x="60" y="360" fill="#8B5CF6" opacity="0">
      <tspan fill="#00F5FF">Current Focus:</tspan> Building Production AI Systems
      <animate attributeName="opacity" values="0;1" dur="0.1s" fill="freeze" begin="7.6s"/>
    </text>

    <!-- Blinking Cursor -->
    <rect x="60" y="370" width="8" height="16" fill="#00F5FF" filter="url(#termGlow)">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" begin="8s"/>
    </rect>
  </g>

  <!-- Scanline Effect -->
  <rect x="25" y="60" width="1150" height="2" fill="rgba(0, 245, 255, 0.03)">
    <animate attributeName="y" values="60;380;60" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner Accents -->
  <path d="M 25 75 L 25 60 L 40 60" fill="none" stroke="#00F5FF" stroke-width="1.5" opacity="0.6"/>
  <path d="M 1175 75 L 1175 60 L 1160 60" fill="none" stroke="#00F5FF" stroke-width="1.5" opacity="0.6"/>
  <path d="M 25 325 L 25 340 L 40 340" fill="none" stroke="#00F5FF" stroke-width="1.5" opacity="0.6"/>
  <path d="M 1175 325 L 1175 340 L 1160 340" fill="none" stroke="#00F5FF" stroke-width="1.5" opacity="0.6"/>
</svg>